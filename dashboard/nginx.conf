# Mounted at /etc/nginx/conf.d/default.conf inside the official nginx image.
# Route /api through the same site as React to keep sessionid/CSRF same-origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 130m; # Media studio uploads; backend enforces actual limits.

    # Docker embedded DNS: keep Nginx bootable even if backend is deployed later.
    resolver 127.0.0.11 valid=20s ipv6=off;
    set $safidiko_backend "safidiko-backend:8000";

    # In production the front-end edge must terminate TLS and set this header.
    # Docker dashboard is bound to loopback in Jenkins; it must not be public HTTP.
    set $upstream_protocol $scheme;
    if ($http_x_forwarded_proto = "https") {
        set $upstream_protocol "https";
    }

    location = / { return 302 /dashboard; }

    location = /api { return 308 /api/; }
    location ^~ /api/ {
        proxy_pass http://$safidiko_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_protocol;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }
    location ^~ /admin/ {
        proxy_pass http://$safidiko_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_protocol;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Public covers and static files only. Never mount /app/private_media here.
    location ^~ /media/ {
        alias /srv/safidiko/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location ^~ /static/ {
        alias /srv/safidiko/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Actual React routes: /dashboard, /login, /tantara, /arbre, etc.
    location = /dashboard { try_files $uri /index.html; }
    location = /login { try_files $uri /index.html; }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
